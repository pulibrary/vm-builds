---
# Keep a desktop image behaving like a server: never suspend, never blank the
# screen, never lock. An idle console must not make the machine unreachable.

- name: Prevent the system from ever suspending or hibernating
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop: "{{ ubuntu_desktop_masked_sleep_targets }}"

- name: Ignore idle sessions, lid and power keys in logind
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/10-no-idle-actions.conf
    mode: "0644"
    content: |
      # Managed by the ubuntu_desktop role.
      # A desktop image built here is administered remotely, so an idle or
      # "closed lid" console must never suspend it or end its sessions.
      [Login]
      IdleAction=ignore
      IdleActionSec=0
      HandleSuspendKey=ignore
      HandleHibernateKey=ignore
      HandleLidSwitch=ignore
      HandleLidSwitchDocked=ignore
      HandleLidSwitchExternalPower=ignore

- name: Disable X11 screen blanking and DPMS power saving
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/10-no-screen-blanking.conf
    mode: "0644"
    content: |
      # Managed by the ubuntu_desktop role.
      # Applies to every X session including the login greeter, so the console
      # stays visible for VNC or a hypervisor console at all times.
      Section "ServerFlags"
          Option "BlankTime"   "0"
          Option "StandbyTime" "0"
          Option "SuspendTime" "0"
          Option "OffTime"     "0"
      EndSection

      Section "Extensions"
          Option "DPMS" "Disable"
      EndSection

- name: Disable desktop power management and screensaver defaults
  ansible.builtin.copy:
    dest: "/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/{{ item.channel }}.xml"
    mode: "0644"
    content: "{{ item.body }}"
  loop:
    - channel: xfce4-power-manager
      body: |
        <?xml version="1.0" encoding="UTF-8"?>
        <!-- Managed by the ubuntu_desktop role: no idle power saving. -->
        <channel name="xfce4-power-manager" version="1.0">
          <property name="xfce4-power-manager" type="empty">
            <property name="dpms-enabled" type="bool" value="false"/>
            <property name="blank-on-ac" type="uint" value="0"/>
            <property name="blank-on-battery" type="uint" value="0"/>
            <property name="dpms-on-ac-sleep" type="uint" value="0"/>
            <property name="dpms-on-ac-off" type="uint" value="0"/>
            <property name="dpms-on-battery-sleep" type="uint" value="0"/>
            <property name="dpms-on-battery-off" type="uint" value="0"/>
            <property name="inactivity-on-ac" type="uint" value="0"/>
            <property name="inactivity-on-battery" type="uint" value="0"/>
            <property name="lock-screen-suspend-hibernate" type="bool" value="false"/>
          </property>
        </channel>
    - channel: xfce4-screensaver
      body: |
        <?xml version="1.0" encoding="UTF-8"?>
        <!-- Managed by the ubuntu_desktop role: no screensaver, no locking. -->
        <channel name="xfce4-screensaver" version="1.0">
          <property name="saver" type="empty">
            <property name="enabled" type="bool" value="false"/>
            <property name="idle-activation" type="empty">
              <property name="enabled" type="bool" value="false"/>
            </property>
          </property>
          <property name="lock" type="empty">
            <property name="enabled" type="bool" value="false"/>
            <property name="saver-activation" type="empty">
              <property name="enabled" type="bool" value="false"/>
            </property>
          </property>
        </channel>

- name: Stop screensavers and screen lockers from autostarting
  ansible.builtin.copy:
    dest: "/etc/xdg/autostart/{{ item }}.desktop"
    mode: "0644"
    content: |
      # Managed by the ubuntu_desktop role.
      # Overrides the packaged autostart entry of the same name so this
      # component never starts, whether or not it is installed.
      [Desktop Entry]
      Type=Application
      Name={{ item }} (disabled)
      Exec=/bin/true
      Hidden=true
      X-GNOME-Autostart-enabled=false
  loop: "{{ ubuntu_desktop_disabled_autostart }}"
