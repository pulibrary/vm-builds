# Installed by the vm-builds configure role.
# Images are built under QEMU with virtio-blk but deployed to VMware
# (LSI Logic / PVSCSI / SATA) and Proxmox VE (VirtIO SCSI). A host-only
# initramfs carries only the build VM's disk driver and drops into the
# dracut emergency shell anywhere else, so build a generic one and make
# sure every controller either hypervisor offers is present.
hostonly="no"
add_drivers+=" ahci ata_piix sd_mod sr_mod mptspi mptsas vmw_pvscsi vmxnet3 virtio_pci virtio_blk virtio_scsi virtio_net "
