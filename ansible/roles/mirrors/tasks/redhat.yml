---
- name: Ensure repo tools present
  ansible.builtin.package:
    name:
      - dnf-plugins-core
    state: present
  when: ansible_pkg_mgr == 'dnf'

- name: Ensure Rocky GPG keys present
  ansible.builtin.package:
    name: rocky-gpg-keys
    state: present
  when:
    - ansible_pkg_mgr == 'dnf'
    - ansible_distribution == 'Rocky'

- name: Add PUL Rocky repo (preferred by low cost)
  ansible.builtin.template:
    src: rocky-pulmirror.repo.j2
    dest: /etc/yum.repos.d/00-pulmirror-rocky.repo
    owner: root
    group: root
    mode: '0644'
  when: ansible_distribution == 'Rocky'
  notify: dnf clean

- name: Build package metadata cache
  ansible.builtin.dnf:
    update_cache: yes
  when: ansible_pkg_mgr == 'dnf'
  register: dnf_cache
  retries: 5
  delay: 3
  until: dnf_cache is succeeded

- name: Build package metadata cache (yum fallback)
  ansible.builtin.yum:
    update_cache: yes
  when: ansible_pkg_mgr == 'yum'
  register: yum_cache
  retries: 5
  delay: 3
  until: yum_cache is succeeded
