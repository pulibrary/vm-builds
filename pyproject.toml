[project]
name = "vm-builds"
version = "1.0.0"
description = "Princeton University Library Packer image builds and Ansible provisioning"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Princeton University Library" }]

dependencies = [
  "ansible-core==2.21.4",
  "ansible-lint==26.8.0",
  "boto3==1.43.98",
  "cryptography==50.0.1",
  "google-auth==2.58.0",
  "jmespath==1.1.0",
  "netaddr==1.3.0",
  "passlib==1.7.4",
  "pywinrm==0.5.0",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "yamllint==1.38.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
